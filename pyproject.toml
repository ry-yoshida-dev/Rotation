[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rotation"
version = "0.0.1"
authors = [
  { name = "Ryuto Yoshida" },
]
description = "3D rotations in SO(3): rotation matrices, rotation vectors, and unit quaternions that convert into each other and share composition, inverse, powers, and comparison."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.urls]
"Homepage" = "https://github.com/ry-yoshida-dev/Rotation"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/Rotation/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rotation = ["py.typed"]

[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "mypy>=2.4.1",
    "pytest>=8.0",
    "ruff>=0.17.3",
    "scipy-stubs>=1.17.1.5",
]

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.basedpyright]
include = ["src", "tests"]
# typing.override needs Python 3.12, and the package supports 3.11 without typing_extensions.
reportImplicitOverride = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# Only public classes, methods, and functions need docstrings, and multi-line ones are the local style.
ignore = ["E501", "D100", "D104", "D105", "D200"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
